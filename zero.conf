server {
    listen 443 ssl http2;
    server_name zero.lucianmarin.com;
    access_log /home/lucian/logs/zero.log.gz combined gzip;
    ssl_certificate /etc/letsencrypt/live/zero.lucianmarin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zero.lucianmarin.com/privkey.pem;
    location /source {
        root /home/lucian/zero;
        expires 365d;
        autoindex off;
    }
    location /.well-known/acme-challenge {
        root /home/lucian;
    }
    location / {
        root /home/lucian/zero;
        index index.html;
    }
}

server {
    listen 80;
    server_name zero.lucianmarin.com;
    return 301 https://zero.lucianmarin.com$request_uri;
}

